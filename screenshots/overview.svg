<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <!-- Definitions for gradients, shadows, and markers -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Flow Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>

    <!-- DLQ Flow Arrow Marker -->
    <marker id="arrow-dlq" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>

    <!-- Component Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>

    <!-- Gradient Fills -->
    <linearGradient id="sourceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="kafkaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="flinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="dlqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="serveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Gridlines for Tech Aesthetic -->
  <g opacity="0.05">
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500 M 0,600 L 1200,600 M 0,700 L 1200,700" stroke="#fff" stroke-width="1" />
    <path d="M 150,0 L 150,800 M 300,0 L 300,800 M 450,0 L 450,800 M 600,0 L 600,800 M 750,0 L 750,800 M 900,0 L 900,800 M 1050,0 L 1050,800" stroke="#fff" stroke-width="1" />
  </g>

  <!-- Canvas Header -->
  <text x="50%" y="50" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" letter-spacing="1">URBANPULSE STREAMING PLATFORM ARCHITECTURE</text>
  <text x="50%" y="75" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="400" font-size="14" fill="#94a3b8">Lambda Streaming &amp; Batch Analytics Topology</text>

  <!-- ==================== COLUMN 1: TELEMETRY SOURCES ==================== -->
  <text x="135" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#38bdf8" text-anchor="middle">1. SOURCES</text>
  
  <!-- Bus GPS -->
  <g transform="translate(40, 150)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="url(#sourceGrad)" />
    <text x="95" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">Bus GPS Telemetry</text>
    <text x="95" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Route, Lat/Lon, Speed</text>
  </g>

  <!-- Traffic Signals -->
  <g transform="translate(40, 250)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="url(#sourceGrad)" />
    <text x="95" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">Traffic Signals</text>
    <text x="95" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">Junctions, Vehicle Count</text>
  </g>

  <!-- Air Quality Sensors -->
  <g transform="translate(40, 350)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="url(#sourceGrad)" />
    <text x="95" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">Air Quality Sensors</text>
    <text x="95" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">PM2.5, PM10, NO2, AQI</text>
  </g>

  <!-- Smart Meters -->
  <g transform="translate(40, 450)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="url(#sourceGrad)" />
    <text x="95" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">Smart Meters</text>
    <text x="95" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">kWh, Voltage, Power Factor</text>
  </g>

  <!-- ==================== COLUMN 2: INGESTION BACKBONE (KAFKA) ==================== -->
  <text x="395" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#f472b6" text-anchor="middle">2. INGESTION (KAFKA)</text>
  
  <rect x="290" y="145" width="210" height="395" rx="12" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4,4" />
  
  <!-- Kafka Broker 1 -->
  <g transform="translate(300, 160)" filter="url(#shadow)">
    <rect width="190" height="65" rx="6" fill="url(#kafkaGrad)" />
    <text x="95" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Kafka Broker 1</text>
    <text x="95" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fbcfe8" text-anchor="middle">Leader/Replica Partition</text>
  </g>

  <!-- Kafka Broker 2 -->
  <g transform="translate(300, 245)" filter="url(#shadow)">
    <rect width="190" height="65" rx="6" fill="url(#kafkaGrad)" />
    <text x="95" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Kafka Broker 2</text>
    <text x="95" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fbcfe8" text-anchor="middle">Leader/Replica Partition</text>
  </g>

  <!-- Kafka Broker 3 -->
  <g transform="translate(300, 330)" filter="url(#shadow)">
    <rect width="190" height="65" rx="6" fill="url(#kafkaGrad)" />
    <text x="95" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Kafka Broker 3</text>
    <text x="95" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fbcfe8" text-anchor="middle">Leader/Replica Partition</text>
  </g>

  <!-- DLQ Topic -->
  <g transform="translate(300, 455)" filter="url(#shadow)">
    <rect width="190" height="65" rx="6" fill="url(#dlqGrad)" />
    <text x="95" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">urbanpulse.dlq</text>
    <text x="95" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fee2e2" text-anchor="middle">Replication: 3, Min-ISR: 2</text>
  </g>

  <!-- ==================== COLUMN 3: PROCESSING ENGINE ==================== -->
  <text x="655" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#fb923c" text-anchor="middle">3. STREAM &amp; BATCH PROCESSING</text>

  <!-- Apache Flink -->
  <g transform="translate(560, 180)" filter="url(#shadow)">
    <rect width="190" height="90" rx="8" fill="url(#flinkGrad)" />
    <text x="95" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">Apache Flink</text>
    <text x="95" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ffedd5" text-anchor="middle">Stateful Real-time Engine</text>
    <text x="95" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fed7aa" text-anchor="middle">Watermarks, Timers, RocksDB</text>
  </g>

  <!-- Apache Spark -->
  <g transform="translate(560, 360)" filter="url(#shadow)">
    <rect width="190" height="90" rx="8" fill="url(#sparkGrad)" />
    <text x="95" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">Apache Spark</text>
    <text x="95" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fef9c3" text-anchor="middle">Micro-batch Processing</text>
    <text x="95" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fef08a" text-anchor="middle">15m Window Aggregations</text>
  </g>

  <!-- ==================== COLUMN 4: STORAGE SINKS ==================== -->
  <text x="915" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#34d399" text-anchor="middle">4. STORAGE LAYER</text>

  <!-- PostgreSQL + PostGIS -->
  <g transform="translate(820, 150)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="url(#dbGrad)" />
    <text x="95" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">PostgreSQL + PostGIS</text>
    <text x="95" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Geospatial Routing &amp; Bus GPS</text>
  </g>

  <!-- InfluxDB / TimescaleDB -->
  <g transform="translate(820, 250)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="url(#dbGrad)" />
    <text x="95" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">InfluxDB &amp; TimescaleDB</text>
    <text x="95" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Time-Series Telemetry &amp; Metrics</text>
  </g>

  <!-- Parquet / DFS Sinks -->
  <g transform="translate(820, 350)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="url(#dbGrad)" />
    <text x="95" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">Parquet Columnar Files</text>
    <text x="95" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Long-Term Storage &amp; Audits</text>
  </g>

  <!-- DLQ Sink (JSON/CSV) -->
  <g transform="translate(820, 450)" filter="url(#shadow)">
    <rect width="190" height="70" rx="8" fill="url(#dlqGrad)" />
    <text x="95" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">DLQ Reports &amp; CSV</text>
    <text x="95" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fee2e2" text-anchor="middle">Validation Anomalies</text>
  </g>

  <!-- ==================== COLUMN 5: SERVING LAYER ==================== -->
  <text x="1115" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#a78bfa" text-anchor="middle">5. SERVING / CONSUMERS</text>

  <!-- REST & Signal APIs -->
  <g transform="translate(1040, 160)" filter="url(#shadow)">
    <rect width="150" height="60" rx="6" fill="url(#serveGrad)" />
    <text x="75" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">APIs &amp; Signal Control</text>
    <text x="75" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ddd6fe" text-anchor="middle">Real-time Operations</text>
  </g>

  <!-- Grafana Dashboards -->
  <g transform="translate(1040, 255)" filter="url(#shadow)">
    <rect width="150" height="60" rx="6" fill="url(#serveGrad)" />
    <text x="75" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Grafana Dashboards</text>
    <text x="75" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ddd6fe" text-anchor="middle">Time-Series charts</text>
  </g>

  <!-- Government Portal -->
  <g transform="translate(1040, 350)" filter="url(#shadow)">
    <rect width="150" height="60" rx="6" fill="url(#serveGrad)" />
    <text x="75" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Gov Portal Reports</text>
    <text x="75" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ddd6fe" text-anchor="middle">Monthly analytics</text>
  </g>

  <!-- DLQ Charts & Dashboard -->
  <g transform="translate(1040, 455)" filter="url(#shadow)">
    <rect width="150" height="60" rx="6" fill="url(#dlqGrad)" />
    <text x="75" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">DLQ Chart Generator</text>
    <text x="75" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fee2e2" text-anchor="middle">Matplotlib bar/pie</text>
  </g>


  <!-- ==================== CONNECTORS / FLOW PATHS ==================== -->

  <!-- Connectors from Column 1 (Sources) to Column 2 (Kafka Brokers) -->
  <path d="M 230,185 Q 265,185 265,245 T 300,245" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 230,285 Q 265,285 265,285 T 300,285" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 230,385 Q 265,385 265,320 T 300,320" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 230,485 Q 265,485 265,360 T 300,360" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- DLQ validation reject paths from producers straight to DLQ Topic -->
  <path d="M 230,185 Q 255,225 255,420 T 300,470" fill="none" stroke="#f87171" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow-dlq)" />
  <path d="M 230,285 Q 255,325 255,430 T 300,480" fill="none" stroke="#f87171" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow-dlq)" />
  <path d="M 230,385 Q 255,425 255,440 T 300,490" fill="none" stroke="#f87171" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow-dlq)" />
  <path d="M 230,485 Q 255,495 285,495 T 300,495" fill="none" stroke="#f87171" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow-dlq)" />

  <!-- Connectors from Kafka (Column 2) to Engines (Column 3) -->
  <!-- Kafka to Flink -->
  <path d="M 490,280 Q 525,280 525,225 T 560,225" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Kafka to Spark -->
  <path d="M 490,360 Q 525,360 525,405 T 560,405" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Kafka DLQ to DLQ Consumer -->
  <path d="M 490,490 Q 655,490 655,490 T 820,490" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow-dlq)" />

  <!-- Connectors from Engines (Column 3) to Sinks (Column 4) -->
  <!-- Flink to PostgreSQL + PostGIS -->
  <path d="M 750,210 Q 785,210 785,185 T 820,185" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Flink to InfluxDB -->
  <path d="M 750,240 Q 785,240 785,270 T 820,270" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Spark to Parquet -->
  <path d="M 750,390 Q 785,390 785,385 T 820,385" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Connectors from Sinks (Column 4) to Serving Layer (Column 5) -->
  <path d="M 1010,185 L 1040,185" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 1010,285 L 1040,285" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 1010,385 L 1040,385" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 1010,485 L 1040,485" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow-dlq)" />

  <!-- Legend in Footer -->
  <g transform="translate(100, 680)">
    <rect width="1000" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" fill="#94a3b8">ARCHITECTURE NOTES</text>
    
    <!-- Bullet 1 -->
    <circle cx="35" cy="55" r="4" fill="#3b82f6" />
    <text x="47" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Lambda Architecture: Separation of real-time low-latency alerting and historical analytical processing.</text>

    <!-- Bullet 2 -->
    <circle cx="585" cy="55" r="4" fill="#ef4444" />
    <text x="597" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">DLQ Validation Pattern: All malformed source events bypass main topics, avoiding downstream job failures.</text>

    <!-- Bullet 3 -->
    <circle cx="35" cy="72" r="4" fill="#10b981" />
    <text x="47" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Geospatial Support: PostgreSQL with PostGIS extension facilitates coordinate bounding check and geo-routing queries.</text>

    <!-- Bullet 4 -->
    <circle cx="585" cy="72" r="4" fill="#8b5cf6" />
    <text x="597" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Serving Layer: Integrates REST endpoints, Grafana timeseries visualizations, and aggregated executive CSV reports.</text>
  </g>
</svg>